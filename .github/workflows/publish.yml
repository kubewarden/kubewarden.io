---
name: Publish Site
on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # shortly after midnight UTC.
    - cron: '12 0 * * *'
permissions:
  contents: read
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # actions/configure-pages reads the Pages settings
    env:
      # Updated by updatecli/updatecli.d/updcli-hugo-ver.yml together
      # with HUGO_VERSION in netlify.toml
      HUGO_VERSION: 0.170.1
      HUGO_SHA256: 841a5462853aefc9942e4de1e8a5d75584b6a5181941e6ad3f1d745190e03cd8
    steps:
      - name: Install hugo
        run: |
          set -euo pipefail
          tarball="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSL -o "${tarball}" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${tarball}"
          echo "${HUGO_SHA256}  ${tarball}" | sha256sum -c -
          sudo tar -xzf "${tarball}" -C /usr/local/bin hugo
          rm -f "${tarball}"
          hugo version
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test browser features
        run: node --test tests/*.test.mjs
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build Site
        run: |
          set -e

          hugo --gc --minify --cleanDestinationDir \
            -d ${{ runner.temp }}/gh-pages/
      - name: Upload gh-pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/gh-pages/

  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    steps:
      - name: Publish Site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
