    <div class="hero-visual" aria-hidden="true">
      <div class="hero-diagram">
        <svg class="diagram-svg" viewBox="0 0 100 100" preserveAspectRatio="none" focusable="false">
          <defs>

          </defs>

          <ellipse class="diagram-glow" cx="50" cy="48" rx="56" ry="48"/>

          <!-- decorative cubes -->
          <g class="diagram-cube" transform="translate(19,18) scale(1.15)">
            <polygon points="0,3 4,1 8,3 8,7 4,9 0,7" class="cube-top"/>
            <polygon points="0,3 4,5 4,9 0,7" class="cube-left"/>
            <polygon points="8,3 4,5 4,9 8,7" class="cube-right"/>
          </g>
          <g class="diagram-cube" transform="translate(76,16) scale(1.25)">

            <polygon points="0,3 4,1 8,3 8,7 4,9 0,7" class="cube-top"/>
            <polygon points="0,3 4,5 4,9 0,7" class="cube-left"/>
            <polygon points="8,3 4,5 4,9 8,7" class="cube-right"/>
          </g>

          <!-- connector ring -->
          <ellipse class="diagram-ring" cx="50" cy="48" rx="30" ry="24"/>

          <!-- spokes -->
          <line class="diagram-spoke" x1="50" y1="24" x2="50" y2="14.5" marker-end="url(#diagramArrow)"/>
          <line class="diagram-spoke" x1="50" y1="72" x2="50" y2="81.5" marker-end="url(#diagramArrow)"/>
          <line class="diagram-spoke" x1="20" y1="48" x2="10.5" y2="48" marker-end="url(#diagramArrow)"/>
          <line class="diagram-spoke" x1="80" y1="48" x2="89.5" y2="48" marker-end="url(#diagramArrow)"/>

          <circle class="diagram-node" cx="20" cy="48" r="1.1"/>
          <circle class="diagram-node" cx="80" cy="48" r="1.1"/>

          <!-- isometric plinth -->
          <g class="diagram-plinth">
            <polygon class="plinth-face plinth-face--3" points="50,47 66,54 50,61 34,54"/>
            <polygon class="plinth-side plinth-side--right" points="50,55 66,48 66,54 50,61"/>
            <polygon class="plinth-side plinth-side--left" points="34,48 50,55 50,61 34,54"/>

            <polygon class="plinth-face plinth-face--2" points="50,41 66,48 50,55 34,48"/>
            <polygon class="plinth-side plinth-side--right" points="50,49 66,42 66,48 50,55"/>
            <polygon class="plinth-side plinth-side--left" points="34,42 50,49 50,55 34,48"/>

            <polygon class="plinth-face plinth-face--1" points="50,35 66,42 50,49 34,42"/>
          </g>
        </svg>

        <img class="diagram-hub-logo" src="/images/kubernetes-logo.svg" alt="">

        <div class="diagram-card diagram-card--top">
          <svg class="icon" aria-hidden="true"><use xlink:href="#icon-cube"></use></svg>
          <span>Runtime Enforcer</span>
        </div>
        <div class="diagram-card diagram-card--left">
          <svg class="icon" aria-hidden="true"><use xlink:href="#icon-shield"></use></svg>
          <span>Admission Controller</span>
        </div>
        <div class="diagram-card diagram-card--right">
          <svg class="icon" aria-hidden="true"><use xlink:href="#icon-nodes"></use></svg>
          <span>Network Enforcer</span>
        </div>
        <div class="diagram-card diagram-card--bottom">
          <svg class="icon" aria-hidden="true"><use xlink:href="#icon-scan"></use></svg>
          <span>SBOM Scanner</span>
        </div>
