baseURL = ""
locale = "en-us"
timeZone = "UTC"
title = "Kubewarden"
pluralizeListTitles = false
enableRobotsTXT = true
pygmentsCodeFences = true
pygmentsCodeFencesGuessSyntax = true
enableGitInfo = true
googleAnalytics = 'G-PSW07XK7TM'

# Allow HTML content files. The site's four component pages are HTML,
# not Markdown, so Hugo's newer default (deny text/html) blocks them.
[security]
allowContent = ["! ^text/org$"]

[blackfriday]
fractions = false
#hrefTargetBlank = true

[outputFormats.Algolia]
baseName = "algolia"
isPlaintext = true
mediaType = "application/json"
notAlternative = true

[params.algolia]
vars = ["title", "summary", "date", "publishdate", "expirydate", "permalink"]
params = ["categories", "tags"]

[params]
github = "https://github.com/kubewarden"

[outputs]
home = ["HTML", "RSS"]

[privacy]
[privacy.googleAnalytics]
anonymizeIP = true

[menu]

[[menu.main]]
identifier = "platform"
name = "Platform"
url = "/#components"
weight = -140

[[menu.main]]
identifier = "docs"
name = "Docs"
url = "https://docs.kubewarden.io/"
weight = -130

[[menu.main]]
identifier = "blog"
name = "Blog"
url = "/blog"
weight = -110

[[menu.main]]
identifier = "community"
name = "Community"
url = "/#get-in-touch"
weight = -100

[[menu.main]]
identifier = "enterprise"
name = "Enterprise"
url = "https://docs.kubewarden.io/enterprise"
weight = -50

[taxonomies]
component = "components"
type = "types"

[markup.highlight]
noClasses = false

[related]
threshold = 30
includeNewer = true
toLower = true

[[related.indices]]
name = "components"
weight = 100

[[related.indices]]
name = "types"
weight = 40
